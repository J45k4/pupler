name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: windows-x64
            runner: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]'
      - run: bun install --frozen-lockfile
      - name: Test
        if: runner.os == 'Linux'
        run: bun test
      - run: bun run build:release
        env:
          PUPLER_VERSION: ${{ env.RELEASE_TAG }}
      - name: Smoke test standalone binaries
        if: runner.os == 'Linux'
        run: bun scripts/smoke-release.ts
      - name: Package release
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cp -r service dist/release/service
          rm -f dist/release/service/pupler-bun.service
          mkdir -p dist/assets
          tar -czf "dist/assets/pupler-$PLATFORM.tar.gz" -C dist/release .
          cd dist/assets
          sha256sum "pupler-$PLATFORM.tar.gz" > "pupler-$PLATFORM.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pupler-${{ matrix.platform }}
          path: dist/assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes release-assets/*
          gh release edit "$TAG" --draft=false
